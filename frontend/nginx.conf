# non-root nginx (uid 101) слушает 8080; Service в k8s — 80 → 8080
server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # заголовки безопасности (compliance.md, раздел 117): тип содержимого не угадывается,
    # реферер наружу — только origin, встраивание в чужие фреймы запрещено. add_header внутри
    # location отменяет заголовки уровня server — поэтому они повторены в каждом location
    # со своими add_header. CSP и HSTS — на ingress заказчика (TLS и политика домена там).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

    # рантайм-конфиг (ConfigMap frontend-env либо envsubst из шаблона): window.__ENV__ = {...}
    location = /config.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
    }
}
