[project]
name = "crm-notification"
version = "0.1.0"
description = "«Альма» (ЛЦТ 2026) — сервис нотификаций и Telegram-бот: HTTP relay каналов + aiogram long-polling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "aiogram>=3.13,<4",
    "httpx>=0.27,<1",
    "redis>=5.0,<6",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.3,<3",
    "jinja2>=3.1,<4",
    "pyjwt[crypto]>=2.8,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
