[project]
name = "crm-backend"
version = "1.0.0"
description = "CRM для работы с вузами (ЛЦТ 2026) — backend, модульный монолит FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42.0",
    "redis>=5.0",
    "minio>=7.2",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "charset-normalizer>=3.3",
    "sse-starlette>=2.1",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "T20"]
ignore = [
    "B008",  # FastAPI DI использует вызовы Depends()/Query() в дефолтах — это идиома фреймворка
]

[tool.ruff.lint.per-file-ignores]
# табличные демо-данные сида читаются лучше одной строкой на запись
"app/tools/seed.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
