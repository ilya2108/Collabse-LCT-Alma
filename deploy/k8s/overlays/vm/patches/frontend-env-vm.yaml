# VPS: рантайм-конфиг SPA указывает на публичный https-хост Keycloak
# (https — secure context, keycloak-js PKCE S256 / window.crypto.subtle работают).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
data:
  config.js: |
    window.__ENV__ = {
      KEYCLOAK_URL: "https://id.crm.168-113-158-10.nip.io",
      KEYCLOAK_REALM: "crm",
      KEYCLOAK_CLIENT_ID: "crm-frontend",
      API_BASE: "/api"
    };
