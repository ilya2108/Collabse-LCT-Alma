# cert-manager создаёт поды-солверы http01 В ЭТОМ namespace (по месту Ingress),
# а default-deny-all перекрыл бы им и входящий челлендж от traefik, и egress
# до kube-apiserver. Без этой политики LE-сертификаты не выпустятся.
# k3s enforce'ит NetworkPolicy из коробки (kube-router).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-solver
spec:
  podSelector:
    matchLabels: {acme.cert-manager.io/http01-solver: "true"}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 8089, protocol: TCP} # штатный порт acmesolver
  egress:
    - {} # self-check солвера; под живёт считанные минуты — допустимо
