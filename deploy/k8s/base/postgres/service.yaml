# Два Service: headless для StatefulSet + обычный ClusterIP —
# приложения ходят по короткому DNS postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres-hl
  labels: {app.kubernetes.io/name: postgres, tier: data}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: 5432}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, tier: data}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: 5432}
