# «Право на забвение» (152-ФЗ): физическое удаление soft-deleted записей
# старше 30 дней — раз в сутки (api-contract.md §11.2). Триггер-паттерн тот же,
# что у stuck-check: логика в backend, CronJob только дёргает endpoint.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: purge-deleted
  labels: {app.kubernetes.io/name: purge-deleted, role: job}
spec:
  schedule: "30 3 * * *" # ежедневно ночью
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: {app.kubernetes.io/name: purge-deleted, role: job}
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.10.1
              command:
                - sh
                - -c
                # --retry-connrefused: как у stuck-check — ждём применения NetworkPolicy
                # к свежему поду Job, первый мгновенный connect может получить reject.
                - >
                  curl -fsS -X POST
                  --retry 5 --retry-connrefused --retry-delay 3 --retry-max-time 90
                  -H "X-Internal-Token: $INTERNAL_API_TOKEN"
                  http://backend:8000/api/v1/internal/jobs/purge-deleted
              env:
                - name: INTERNAL_API_TOKEN
                  valueFrom: {secretKeyRef: {name: crm-internal, key: INTERNAL_API_TOKEN}}
