# Очистка просроченных ключей Idempotency-Key (TTL 24 ч, api-contract.md §1.6):
# сохранённые ответы мутаций — ПДн-шифртекст, дольше срока не храним. Триггер-паттерн
# тот же, что у stuck-check и purge-deleted: логика в backend (DELETE пачками по
# expires_at), CronJob только дёргает endpoint.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: idempotency-purge
  labels: {app.kubernetes.io/name: idempotency-purge, role: job}
spec:
  schedule: "15 * * * *" # ежечасно, со сдвигом от stuck-check
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: {app.kubernetes.io/name: idempotency-purge, role: job}
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.10.1
              command:
                - sh
                - -c
                # --retry-connrefused: как у stuck-check — ждём применения NetworkPolicy
                # к свежему поду Job, первый мгновенный connect может получить reject.
                - >
                  curl -fsS -X POST
                  --retry 5 --retry-connrefused --retry-delay 3 --retry-max-time 90
                  -H "X-Internal-Token: $INTERNAL_API_TOKEN"
                  http://backend:8000/api/v1/internal/jobs/purge-idempotency-keys
              env:
                - name: INTERNAL_API_TOKEN
                  valueFrom: {secretKeyRef: {name: crm-internal, key: INTERNAL_API_TOKEN}}
