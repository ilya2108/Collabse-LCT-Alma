# lms-stub — имитация внешней LMS отдельным процессом: двусторонность интеграции
# проверяется честно, по сети; UI журнала вызовов — http://lms.crm.local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-stub
  labels: {app.kubernetes.io/name: lms-stub, tier: app}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lms-stub}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lms-stub, tier: app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lms-stub
          image: crm/lms-stub:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8020, name: http}]
          env:
            - name: CRM_WEBHOOK_URL
              value: http://backend:8000/api/v1/integrations/lms/webhook
            - name: LMS_WEBHOOK_SECRET # HMAC-подпись X-Webhook-Signature
              valueFrom: {secretKeyRef: {name: crm-internal, key: LMS_WEBHOOK_SECRET}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data} # SQLite-журнал вне слоя контейнера
      volumes:
        - {name: data, emptyDir: {}}
