apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend, tier: app}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, tier: app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # штатный uid образа nginx-unprivileged
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: crm/frontend:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          volumeMounts:
            # рантайм-конфиг SPA: смонтированный файл имеет приоритет над envsubst-генерацией
            - name: frontend-env
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: frontend-env
          configMap: {name: frontend-env}
