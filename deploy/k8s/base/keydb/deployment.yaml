# KeyDB — только кэш (cache-aside crm:v1:*, one-time коды бота, идемпотентность):
# потеря содержимого ничего не ломает — всё восстановимо из PG, приложение
# деградирует в чтение из PG. Поэтому Deployment + emptyDir, а не StatefulSet —
# осознанное решение (аргумент на защите), не упрощение.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keydb
  labels: {app.kubernetes.io/name: keydb, tier: data}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: keydb}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keydb, tier: data}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # uid/gid пользователя keydb в образе
        runAsGroup: 999
        fsGroup: 999 # emptyDir /data доступен на запись (RDB-снапшоты дефолтного конфига)
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keydb
          # пин по digest (deployment.md §10.4): версионные теги eqalpha арх-специфичны
          # (x86_64_*/arm64_*), поэтому фиксируем мультиарх-манифест v6.3.4 digest'ом
          image: eqalpha/keydb@sha256:6537505c42355ca1f571276bddf83f5b750f760f07b2a185a676481791e388ac # v6.3.4
          imagePullPolicy: IfNotPresent
          args: ["keydb-server", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{containerPort: 6379, name: redis}]
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            exec: {command: ["keydb-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["keydb-cli", "ping"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: data
          emptyDir: {}
