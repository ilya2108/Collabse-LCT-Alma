# Дев-стенд: быстрый inner loop (hot-reload backend/notification, vite на хосте).
# Кластер (make k8s-up) — для стенда и демо, compose — для разработки.
# Окружение: deploy/compose/.env (генерируется `make dev-env`).
# Фронтенд в dev запускается на хосте: cd frontend && npm run dev (порт 5173,
# прокси /api → localhost:8000); контейнерный фронт — по профилю: --profile full.

name: crm-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro # 01-init.sql: CREATE DATABASE keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # entrypoint-обёртка: KC 26 сам НЕ подставляет ${env.*} в realm при импорте
    entrypoint: ["/bin/bash", "/realm-src/import-realm.sh"]
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-crm}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
      # подстановка ${env.*} в realm-crm.json при импорте
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:-dev-notification-secret}
      INTEGRATION_CLIENT_SECRET: ${INTEGRATION_CLIENT_SECRET:-dev-integration-secret}
      LOADTEST_CLIENT_SECRET: ${LOADTEST_CLIENT_SECRET:-dev-loadtest-secret}
      BACKEND_ADMIN_CLIENT_SECRET: ${BACKEND_ADMIN_CLIENT_SECRET:-dev-backend-admin-secret}
    # 8080 — HTTP; mgmt-порт 9000 → хостовой 9001 (9000 хоста занят MinIO API)
    ports: ["8080:8080", "9001:9000"]
    volumes:
      - ../keycloak/realm-crm.json:/realm-src/realm-crm.json:ro
      - ../keycloak/import-realm.sh:/realm-src/import-realm.sh:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z # паритет с k8s minio/statefulset.yaml
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9091:9091"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z # паритет с k8s jobs/minio-init-job.yaml
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/crm-files local/crm-imports local/crm-exports"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  keydb:
    # v6.3.4 по digest мультиарх-манифеста (версионные теги eqalpha арх-специфичны);
    # паритет с k8s keydb/deployment.yaml
    image: eqalpha/keydb@sha256:6537505c42355ca1f571276bddf83f5b750f760f07b2a185a676481791e388ac
    command: ["keydb-server", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: {context: ../../backend, target: builder} # dev-стадия с uv
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@postgres:5432/crm
      KEYDB_URL: redis://keydb:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_FILES: crm-files
      S3_BUCKET_IMPORTS: crm-imports
      S3_BUCKET_EXPORTS: crm-exports
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/crm # в dev браузер и backend видят KC на localhost:8080
      KEYCLOAK_REALM: crm
      # сервисные клиенты (бот/интеграции) и crm-loadtest (k6/smoke) — азп их токенов;
      # только dev/демо: боевой контур — см. deploy/k8s/components/prod-hardening
      KEYCLOAK_AUDIENCES: account,crm-frontend,crm-notification,crm-integration,crm-loadtest
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-crm-backend-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${BACKEND_ADMIN_CLIENT_SECRET:-dev-backend-admin-secret}
      LMS_BASE_URL: http://lms-stub:8020
      CMS_BASE_URL: http://cms-stub:8030
      NOTIFICATION_BASE_URL: http://notification:8010
      PII_FERNET_KEYS: ${PII_FERNET_KEYS:?run make dev-env}
      PII_HMAC_KEY: ${PII_HMAC_KEY:?run make dev-env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      LMS_WEBHOOK_SECRET: ${LMS_WEBHOOK_SECRET:-dev-lms-secret}
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET:-dev-cms-secret}
      STUCK_DEFAULT_DAYS: "14"
    volumes: [../../backend:/app] # hot-reload
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      keydb: {condition: service_healthy}
      minio: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  notification:
    build: {context: ../../services/notification, target: builder}
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010", "--reload"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-} # пусто => канал TG в режиме console-заглушки
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      # как и у backend: iss браузерных dev-токенов — localhost:8080 (иначе
      # GET /api/v1/outbox отклонял бы admin-Bearer по iss)
      KEYCLOAK_ISSUER: http://localhost:8080/realms/crm
      # deep-links «Открыть в CRM» в Telegram: dev-фронт на хосте (vite)
      CRM_PUBLIC_URL: http://localhost:5173
      KEYCLOAK_REALM: crm
      KC_CLIENT_ID: crm-notification
      KC_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:-dev-notification-secret}
      BACKEND_BASE_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
    volumes: [../../services/notification:/app]
    ports: ["8010:8010"]
    depends_on:
      keycloak: {condition: service_healthy}

  lms-stub:
    build: {context: ../../services/lms-stub}
    environment:
      CRM_WEBHOOK_URL: http://backend:8000/api/v1/integrations/lms/webhook
      LMS_WEBHOOK_SECRET: ${LMS_WEBHOOK_SECRET:-dev-lms-secret}
    volumes: [lmsdata:/data] # SQLite-журнал вне слоя контейнера
    ports: ["8020:8020"]

  cms-stub:
    build: {context: ../../services/cms-stub}
    environment:
      CRM_WEBHOOK_URL: http://backend:8000/api/v1/integrations/cms/webhook
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET:-dev-cms-secret}
    volumes: [cmsdata:/data] # SQLite-журнал вне слоя контейнера
    ports: ["8030:8030"]

  # полный фронт в контейнере — по требованию: docker compose --profile full up
  frontend:
    profiles: [full]
    build: {context: ../../frontend}
    environment:
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: crm
      KEYCLOAK_CLIENT_ID: crm-frontend
      API_BASE: /api
    ports: ["80:8080"]

volumes:
  pgdata:
  miniodata:
  lmsdata:
  cmsdata:
